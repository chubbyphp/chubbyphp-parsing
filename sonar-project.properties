sonar.organization=chubbyphp
sonar.projectKey=chubbyphp_chubbyphp-parsing
sonar.projectName=chubbyphp-parsing

sonar.sources=src
sonar.tests=tests
sonar.language=php
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=build/phpunit/clover.xml
sonar.php.tests.reportPath=build/phpunit/junit.xml

# Ignore "Classes should not have too many methods" (S1448):
# fluent schema builders and the Parser factory intentionally expose one method
# per schema type / validation constraint, so a high method count is by design.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
