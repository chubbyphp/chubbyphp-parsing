sonar.organization=chubbyphp
sonar.projectKey=chubbyphp_chubbyphp-parsing
sonar.projectName=chubbyphp-parsing

sonar.sources=src
sonar.tests=tests
sonar.language=php
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=build/phpunit/clover.xml
sonar.php.tests.reportPath=build/phpunit/junit.xml

sonar.issue.ignore.multicriteria=e1,e2

# S1448 "too many methods": one method per schema type / constraint is the fluent API design
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

# S1192 "duplicated literals": regex fragments in the RFC 3986 grammar repeat by coincidence
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=src/Schema/StringSchema.php
